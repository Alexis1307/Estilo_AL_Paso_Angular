<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/app/dashboard" class="brand-link">
      <div class="navbar-logo-circle">
        <img src="logo-estilo-al-paso.jpeg" alt="Logo">
      </div>
      <span class="brand-name">Estilo Al Paso</span>
    </a>
  </div>

  <div class="navbar-links">
    <a routerLink="/app/registrar-prenda" routerLinkActive="active" class="nav-link">
      📦 Registrar Prenda
    </a>
    <a routerLink="/app/crear-cliente" routerLinkActive="active" class="nav-link">
      👤 Registrar Cliente
    </a>
    <a routerLink="/app/envios" routerLinkActive="active" class="nav-link">
      🚚 Envíos
    </a>
  </div>

  <div class="navbar-right">
    <div class="hamburger-wrapper">
      <button class="hamburger-btn" (click)="toggleMenu()">
        <span class="hamburger-icon">☰</span>
        <span class="user-name">{{ usuario }}</span>
      </button>

      <div class="dropdown-menu" *ngIf="menuAbierto">
        <a routerLink="/app/dashboard" class="dropdown-item" (click)="menuAbierto = false">
          📊 Dashboard
        </a>
        <a routerLink="/app/clientes" class="dropdown-item" (click)="menuAbierto = false">
          👥 Clientes
        </a>
        <div class="dropdown-divider"></div>
        <div class="dropdown-user">
          <span class="dropdown-username">{{ usuario }}</span>
          <span class="dropdown-rol">{{ rol }}</span>
        </div>
        <button class="dropdown-logout" (click)="logout()">🚪 Cerrar Sesión</button>
      </div>
    </div>
  </div>
</nav>

<div class="detalle-container">
  <div class="page-header">
    <button (click)="cancelar()">← Volver</button>
    <h2>Registrar Cliente</h2>
  </div>

  @if (exito) {
  <div class="success">{{ exito }}</div>
  }

  @if (error) {
  <div class="error">{{ error }}</div>
  }

  <div class="form-card">
    <input [(ngModel)]="datos.usuarioTikTok" placeholder="TikTok" />
    <input [(ngModel)]="datos.nombreReal" placeholder="Nombre" />
    <input [(ngModel)]="datos.telefono" placeholder="Teléfono" />
    <input [(ngModel)]="datos.dni" placeholder="DNI" />

    <!-- MODO CIUDAD -->
    <div class="modo-ciudad">
      <button
        [class.active]="modo === 'TRUJILLO'"
        (click)="seleccionarModo('TRUJILLO')">
        📍 Trujillo
      </button>
      <button
        [class.active]="modo === 'OTRO'"
        (click)="seleccionarModo('OTRO')">
        🏙️ Otra Ciudad
      </button>
    </div>

    @if (modo === 'OTRO') {
    <input
      [(ngModel)]="datos.ciudad"
      placeholder="Ciudad"
      (ngModelChange)="onCiudadChange()"
    />
    }

    @if (esTrujillo) {
    <input [(ngModel)]="datos.direccion" placeholder="Dirección" />
    }

    @if (modo === 'OTRO') {
    <input
      [(ngModel)]="busquedaAgencia"
      placeholder="Buscar agencia"
      (ngModelChange)="onAgenciaBusquedaChange()"
    />

    @if (agencias.length > 0) {
    <ul>
      @for (a of agencias; track a.id) {
      <li (click)="seleccionarAgencia(a)">
        {{ a.nombre }}
      </li>
      }
    </ul>
    }
    }

    <button (click)="guardar()" [disabled]="guardando">
      {{ guardando ? 'Guardando...' : '✨ Crear Cliente' }}
    </button>
  </div>
</div>
